<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON GLIDE — Daily Challenge</title>
<meta name="description" content="One-button neon glider. Everyone in the world gets the same course every day. How far can you glide?">
<meta property="og:title" content="NEON GLIDE — Daily Challenge">
<meta property="og:description" content="One-button neon glider. Same course worldwide every day. Beat your friends!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://neon.habitschool.kr/">
<meta property="og:image" content="https://neon.habitschool.kr/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="NEON GLIDE — a neon glider trailing rainbow light past a numbered gate.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://neon.habitschool.kr/og-card.png">
<link rel="canonical" href="https://neon.habitschool.kr/">
<!-- PWA: 홈화면 설치 · 오프라인 플레이 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05010f">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEON GLIDE">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05010f;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    touch-action: none;
    /* 손가락을 아래로 쓸면 당겨서-새로고침이 걸려 게임이 통째로 다시 뜬다.
       설치형(TWA/PWA)에서는 그때 주소창까지 내려온다 — 제스처 자체를 막는다. */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #game { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 13px;
    background: rgba(5, 1, 15, 0.72);
    backdrop-filter: blur(6px);
    color: #e8e6ff;
    text-align: center;
    z-index: 10;
    padding: 24px;
    overflow-y: auto;
    /* 스크롤이 끝까지 간 뒤의 여분 동작이 바깥(브라우저)으로 새어 나가지 않게 */
    overscroll-behavior: contain;
  }
  .overlay.hidden { display: none; }
  h1 {
    font-size: clamp(38px, 9vw, 72px);
    font-weight: 800;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, #00f0ff, #ff2df7, #ffe14d);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 45, 247, 0.45));
  }
  .sub { font-size: 15px; opacity: 0.85; line-height: 1.6; }
  .seed-tag {
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid rgba(0, 240, 255, 0.5);
    border-radius: 999px;
    color: #7ff5ff;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.25) inset, 0 0 10px rgba(0, 240, 255, 0.2);
  }
  .big-score {
    font-size: clamp(52px, 12vw, 96px);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 24px #00f0ff, 0 0 60px rgba(0,240,255,.5);
  }
  .best { font-size: 14px; color: #ffe14d; text-shadow: 0 0 10px rgba(255,225,77,.6); }
  button {
    font-size: 17px; font-weight: 700;
    padding: 14px 34px;
    border: none; border-radius: 14px;
    cursor: pointer;
    color: #05010f;
    background: linear-gradient(90deg, #00f0ff, #6a5bff);
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.55);
    transition: transform .12s ease;
  }
  button:active { transform: scale(0.94); }
  button.ghost {
    background: transparent;
    color: #ff8df9;
    border: 1.5px solid #ff2df7;
    box-shadow: 0 0 16px rgba(255, 45, 247, 0.35);
  }
  #hud {
    position: fixed; top: 16px; left: 0; right: 0;
    display: flex; justify-content: center;
    pointer-events: none; z-index: 5;
  }
  #hud span {
    font-size: 34px; font-weight: 800; color: #fff;
    text-shadow: 0 0 16px #00f0ff;
  }
  #mult-badge {
    font-size: 20px !important;
    color: #ffe14d !important;
    text-shadow: 0 0 12px rgba(255, 225, 77, 0.9) !important;
    margin-left: 10px;
    align-self: flex-start;
  }
  #mult-badge.fever {
    color: #ffc93c !important;
    text-shadow: 0 0 16px rgba(255, 201, 60, 0.95) !important;
    animation: feverPulse 0.5s infinite alternate;
  }
  /* ×10 = 방패 보유. 꼬리와 같은 무지개로 묶어 둔다 */
  #mult-badge.max {
    color: #ff2df7 !important;
    text-shadow: 0 0 18px #ff2df7 !important;
    animation: maxHue 0.9s linear infinite;
  }
  @keyframes maxHue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  #gate-badge {
    font-size: 22px !important;
    font-weight: 800;
    color: #7ff5ff !important;
    text-shadow: 0 0 10px rgba(0, 240, 255, 0.9) !important;
    margin-left: 12px;
    align-self: center;
  }
  @keyframes feverPulse { from { opacity: 0.75; } to { opacity: 1; } }
  #new-best {
    font-size: 22px;
    animation: feverPulse 0.4s infinite alternate;
  }
  #new-best.hidden, #rank-hint.hidden, #btn-install.hidden, #privacy-box.hidden { display: none; }
  /* 개인정보 안내는 항상 보이되, 시작 버튼의 시선을 뺏지 않도록 작고 조용하게 */
  .linky {
    background: none; border: none; box-shadow: none;
    color: rgba(150, 165, 205, 0.75);
    font-size: 12px; letter-spacing: 0.04em;
    text-decoration: underline; text-underline-offset: 3px;
    padding: 6px 10px; margin-top: 10px; cursor: pointer;
  }
  .linky:hover { color: #cfe3ff; }
  .legal {
    max-width: 560px; margin: 8px auto 0;
    font-size: 12px; line-height: 1.6;
    color: rgba(178, 190, 224, 0.92);
    background: rgba(10, 6, 30, 0.72);
    border: 1px solid rgba(120, 100, 200, 0.35);
    border-radius: 10px; padding: 12px 16px; text-align: left;
  }
  /* 오늘 세계 1위 — 닿을 수 있는 목표선 */
  #day-top {
    font-size: 13px; color: #ffd166;
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.45);
    margin-top: -4px; min-height: 16px;
  }
  #day-top.lead { color: #39ff88; text-shadow: 0 0 10px rgba(57, 255, 136, 0.5); }
  /* 플레이 중에는 화면 구석 버튼들이 클릭을 먹지 않도록 비운다 (일시정지하면 돌아온다) */
  body.playing #lang,
  body.playing #fs-btn,
  body.playing #mute { opacity: 0; pointer-events: none; }
  #lang, #fs-btn, #mute { transition: opacity .18s ease; }
  #toast {
    position: fixed; bottom: 34px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0, 240, 255, 0.14);
    border: 1px solid rgba(0, 240, 255, 0.6);
    color: #bffaff;
    padding: 10px 22px; border-radius: 999px;
    font-size: 14px;
    opacity: 0; transition: all .3s ease;
    pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #mute {
    position: fixed; top: 14px; right: 18px; z-index: 15;
    font-size: 24px; cursor: pointer; opacity: 0.75;
  }
  #mute:hover { opacity: 1; }
  #pause-btn {
    position: fixed; top: 14px; right: 58px; z-index: 15;
    font-size: 22px; cursor: pointer; opacity: 0.75;
  }
  #pause-btn:hover { opacity: 1; }
  #lang {
    position: fixed; top: 16px; left: 16px; z-index: 15;
    background: rgba(10, 5, 30, 0.85);
    color: #bffaff;
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }
  #lb-box {
    width: min(340px, 86vw);
    background: rgba(10, 5, 30, 0.65);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
  }
  #lb-box.hidden { display: none; }
  .lb-title { font-weight: 700; color: #7ff5ff; margin-bottom: 8px; }
  #lb-list { text-align: left; line-height: 1.75; min-height: 20px; }
  #lb-list { max-height: 232px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  #lb-list::-webkit-scrollbar { display: none; }
  @keyframes meFlash {
    0% { color: #ff2df7; text-shadow: 0 0 10px #ff2df7; }
    25% { color: #ffe14d; text-shadow: 0 0 10px #ffe14d; }
    50% { color: #39ff88; text-shadow: 0 0 10px #39ff88; }
    75% { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
    100% { color: #ff2df7; text-shadow: 0 0 10px #ff2df7; }
  }
  #lb-list .me { font-weight: 800; animation: meFlash 1.1s linear infinite; }
  #lb-list .rank { display: inline-block; width: 26px; opacity: .65; }
  #lb-list .sc { float: right; font-weight: 700; }
  #lb-list .r1 { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
  #lb-list .r2 { color: #d8dee8; }
  #lb-list .r3 { color: #e8a06a; }
  #lb-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 6px; font-size: 13px; color: #7ff5ff;
  }
  #lb-nav button {
    background: transparent; border: 1px solid rgba(0, 240, 255, 0.35);
    color: #7ff5ff; box-shadow: none;
    padding: 2px 10px; font-size: 13px; border-radius: 8px;
  }
  #lb-nav button:disabled { opacity: 0.25; cursor: default; }
  #next-course { font-size: 13px; color: #9f97ff; }
  #cal-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #cal-label { font-size: 11px; letter-spacing: .08em; color: rgba(160,175,215,.8); }
  #cal { display: flex; gap: 4px; }
  #cal .d {
    width: 15px; height: 15px; border-radius: 4px; font-size: 9px; line-height: 15px;
    text-align: center; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08);
  }
  #cal .d.m1 { background: #7a4a22; border-color: #c07b38; }
  #cal .d.m2 { background: #6b7076; border-color: #cfd6de; }
  #cal .d.m3 { background: #8a6a12; border-color: #ffd700; }
  #cal .d.m4 { background: #1d6f75; border-color: #7ff5ff; }
  #cal .d.today { outline: 1.5px solid #ff2df7; outline-offset: 1px; }
  /* 런 선택: 오늘의 세 코스를 한눈에 — 이름 / 성격 / 메달 / 내 최고점 */
  #run-list { display: flex; flex-direction: column; gap: 6px; width: min(380px, 86vw); }
  .run-row {
    display: grid; grid-template-columns: 54px 1fr auto auto; align-items: center;
    gap: 8px; width: 100%; padding: 9px 12px; margin: 0;
    font-family: inherit; text-align: left; cursor: pointer;
    color: #dff6ff; background: rgba(10, 5, 30, 0.6);
    border: 1px solid rgba(0, 240, 255, 0.35); border-radius: 11px;
  }
  .run-row .rn { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: #7ff5ff; }
  .run-row .rl { font-size: 12px; color: rgba(190, 205, 240, .85); }
  .run-row .rm { font-size: 15px; min-width: 18px; text-align: center; }
  .run-row .rs { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 62px; text-align: right; }
  .run-row.done { border-color: rgba(57, 255, 136, 0.45); }
  .run-row.locked { cursor: default; opacity: .45; border-color: rgba(255, 255, 255, 0.12); }
  .run-row.next { border-color: #ff2df7; box-shadow: 0 0 12px rgba(255, 45, 247, 0.3); }
  #day-total { font-size: 15px; font-weight: 700; color: #ffe14d; }
  #day-total .dim { font-weight: 400; color: rgba(160,175,215,.8); }
  #medal-line { font-size: 19px; font-weight: 800; color: #ffe14d; }
  #medal-line.hidden, #overdrive-line.hidden { display: none; }
  #overdrive-line { color: #ff8df9; }
  #ybadge { font-size: 14px; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
  /* 회전 컨테이너: 세로로 들면 게임 전체를 가로로 회전시켜 화면을 꽉 채움 */
  #rotator { position: fixed; inset: 0; overflow: hidden; }
  #rotator.rot {
    inset: auto; top: 0; left: 100vw;
    width: 100vh; height: 100vw;
    transform: rotate(90deg);
    transform-origin: top left;
  }
  #fs-btn {
    position: fixed; right: 14px; bottom: 14px; z-index: 15;
    width: 46px; height: 46px; padding: 0;
    font-size: 22px; line-height: 46px; text-align: center;
    color: #bffaff;
    background: rgba(10, 5, 30, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.5);
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
  }

  /* 모바일 / 낮은 화면: 게임오버·시작 화면이 스크롤 없이 한 번에 보이도록 압축 */
  @media (max-width: 680px), (max-height: 560px) {
    .overlay { gap: 7px; padding: 12px; justify-content: center; }
    h1 { font-size: clamp(30px, 12vw, 52px); }
    .big-score { font-size: clamp(38px, 15vw, 60px); text-shadow: 0 0 16px #00f0ff; }
    .sub { font-size: 12.5px; line-height: 1.45; }
    .best { font-size: 12.5px; }
    #new-best, #ybadge { font-size: 15px; }
    .seed-tag { font-size: 11px; padding: 4px 10px; }
    #next-course { font-size: 11px; }
    button { padding: 10px 24px; font-size: 15px; border-radius: 11px; }
    #lb-box { width: min(300px, 90vw); padding: 9px 11px; font-size: 12.5px; }
    #lb-list { max-height: 108px; line-height: 1.55; }
    #lb-name, #lb-send { font-size: 12.5px; padding: 6px 9px; }
    #hud { top: 8px; }
    #hud span { font-size: 24px; }
    #mult-badge { font-size: 15px !important; }
    #gate-badge { font-size: 12px !important; }
    #mute { font-size: 20px; top: 8px; right: 12px; }
    #pause-btn { font-size: 19px; top: 8px; right: 46px; }
    #lang { top: 8px; left: 8px; font-size: 12px; padding: 3px 5px; }
  }
  /* 아주 낮은 가로 화면(모바일 landscape)에서 리더보드 더 축소 */
  @media (max-height: 430px) {
    .overlay { gap: 4px; padding: 8px; }
    .big-score { font-size: clamp(30px, 11vh, 44px); }
    #lb-list { max-height: 64px; }
    .sub, .best { font-size: 11px; }
    /* 메달 달력은 낮은 화면에서 라벨을 접고 칸을 줄여 시작 버튼을 밀어내지 않게 한다 */
    #cal-label { display: none; }
    #cal .d { width: 11px; height: 11px; line-height: 11px; font-size: 7px; border-radius: 3px; }
    #run-list { gap: 3px; width: min(330px, 84vw); }
    .run-row { padding: 4px 9px; grid-template-columns: 44px 1fr auto auto; }
    .run-row .rn, .run-row .rl, .run-row .rs { font-size: 10.5px; }
    .run-row .rm { font-size: 12px; }
    #day-total { font-size: 12px; }
    #medal-line { font-size: 15px; }
    /* 런 목록이 주 UI가 됐으므로 설명문·부가 줄을 먼저 줄인다 */
    #start-screen h1 { font-size: clamp(20px, 6vh, 28px); letter-spacing: .14em; }
    #start-screen #howto { font-size: 9.5px; line-height: 1.32; max-width: min(560px, 92vw); }
    #start-screen .seed-tag { font-size: 9.5px; padding: 2px 7px; }
    #start-screen #next-course { font-size: 9.5px; }
    #start-screen #streak { font-size: 10px; }
    #start-screen #btn-start { padding: 7px 20px; font-size: 14px; }
    #start-screen .linky { font-size: 10px; }
  }
  /* 그래도 넘치면 잘라내지 말고 스크롤 — 시작 버튼이 사라지는 것이 최악이다 */
  #start-screen { overflow-y: auto; overscroll-behavior: contain; }
  #lb-submit-row { display: flex; gap: 8px; margin-top: 10px; }
  #lb-name {
    flex: 1; min-width: 0;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 8px;
    color: #fff;
    padding: 8px 10px;
    font-size: 14px;
    outline: none;
  }
  #lb-send { padding: 8px 16px; font-size: 14px; border-radius: 8px; }

  /* 게임오버: 기본은 세로 스택 */
  #over-left { display: flex; flex-direction: column; align-items: center; gap: 13px; }
  /* 가로 화면(모바일은 항상 가로): 좌=정보 · 우=리더보드 2단 분할 */
  body.landscape #over-screen {
    flex-direction: row; align-items: center; justify-content: center;
    gap: 5vw; flex-wrap: nowrap;
  }
  body.landscape #over-left { gap: 9px; }
  body.landscape #over-screen #lb-box { align-self: center; }
  body.landscape #lb-list { max-height: 260px; }   /* Top 10 전체가 스크롤 없이 */
</style>
</head>
<body>
<div id="rotator">
<canvas id="game"></canvas>
<div id="hud"><span id="score-live"></span><span id="mult-badge"></span><span id="gate-badge"></span></div>
<div id="pause-btn" title="Pause">⏸</div>
<div id="mute">🔊</div>
<button id="fs-btn" title="Fullscreen">⛶</button>
<select id="lang"></select>

<div class="overlay" id="start-screen">
  <h1>NEON GLIDE</h1>
  <div class="seed-tag" id="seed-tag-start"></div>
  <div id="next-course"></div>
  <p class="sub" id="howto"></p>
  <div class="best" id="streak"></div>
  <div id="cal-wrap"><div id="cal-label"></div><div id="cal"></div></div>
  <div id="ybadge"></div>
  <div id="run-list"></div>
  <div id="day-total"></div>
  <div id="day-top"></div>
  <button id="btn-start"></button>
  <button class="ghost hidden" id="btn-install"></button>
  <button class="linky" id="btn-privacy"></button>
  <div class="legal hidden" id="privacy-box"><span id="privacy-text"></span></div>
</div>

<div class="overlay hidden" id="revive-screen">
  <div class="big-score" id="revive-count">3</div>
  <button id="btn-revive"></button>
  <button class="ghost" id="btn-skip-revive"></button>
</div>

<div class="overlay hidden" id="over-screen">
  <div id="over-left">
    <div class="sub" id="over-label"></div>
    <div class="best hidden" id="new-best"></div>
    <div class="big-score" id="final-score">0</div>
    <div class="best" id="best-over"></div>
    <div class="sub" id="reached-line"></div>
    <div id="medal-line"></div>
    <div class="sub" id="overdrive-line"></div>
    <div class="sub" id="rank-line"></div>
    <div class="sub" id="rank-hint"></div>
    <div class="seed-tag" id="seed-tag-over"></div>
    <button id="btn-share"></button>
    <button class="ghost" id="btn-retry"></button>
    <button class="ghost" id="btn-runs"></button>
  </div>
  <div id="lb-box" class="hidden">
    <div class="lb-title" id="lb-title"></div>
    <div id="lb-nav">
      <button id="lb-prev">◀</button>
      <span id="lb-date"></span>
      <button id="lb-next">▶</button>
    </div>
    <div id="lb-list"></div>
    <div id="lb-submit-row">
      <input id="lb-name" maxlength="12" autocomplete="off">
      <button id="lb-send"></button>
    </div>
  </div>
</div>

<div id="toast"></div>
</div><!-- /#rotator -->

<script>
// CrazyGames SDK — 플랫폼에 올라갔을 때만 의미 있음, 로드 실패 시 조용히 무시
(function () {
  var s = document.createElement('script');
  s.src = 'https://sdk.crazygames.com/crazygames-sdk-v3.js';
  s.async = true;
  s.onload = function () {

  function makeGateSpec(r, i, anchor) {
    const p = Math.min(1, (i - 1) / (CUR.len - 1));
    const k = Math.min(1, Math.max(0, i - CUR.len) / 60);   // 오버드라이브 가중

    let nGaps = 1;

    // 도달 가능성: 직전 기준점에서 물리적으로 닿는 통로를 하나는 보장

    const centers = [];
    for (let j = 0; j < nGaps; j++) {
      const band = usable / nGaps;
      centers.push(margin + band * j + band * (0.3 + r() * 0.4));
    }
    let bi = 0;
    for (let j = 1; j < nGaps; j++) if (Math.abs(centers[j] - anchor) < Math.abs(centers[bi] - anchor)) bi = j;

      Math.max(anchor - reach, Math.min(anchor + reach, centers[bi]))));

    const spec = {
      idx: i, dx, gaps,
      color: NEONS[(r() * NEONS.length) | 0],
      amp: 0, phase: r() * Math.PI * 2,
      pulseAmp: 0, pulse: r() * Math.PI * 2,
      coins: []
    };

    // 레이저: 다중 통로면 한 통로를 통째로, 단일 통로면 틈의 55%만 (브레이크로 타이밍 조절)
    const rl = r();
    if (nGaps >= 2 && i >= CUR.laser + 2 && rl < (0.18 + 0.34 * p + 0.1 * k) * CUR.dens) {

          ox: -dx * 0.78 + j * 46,

  function gateDY(g) {
    if (!g.amp) return 0;

    let minC = Infinity, maxC = -Infinity;
    for (const gp2 of g.gaps) {

  async function lbAll(date) {

  document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); shiftLbDate(-1); });

  // 실제 점수 전송: 익명 인증 신원으로 날짜별 자기 칸에만 기록 (규칙이 경신만 허용).
  // 인증을 아직 쓸 수 없는 환경에서는 레거시 경로로 폴백해 제출이 끊기지 않게 한다.
  async function postScore(name) {
    const body = { n: name, s: submitScore, d: dateStr, t: Date.now() };
    // 세 런의 베스트 궤적을 '|'로 이어 올린다 — 1위 고스트로 모두가 같이 달린다.

    if (joined.length > RUN_N - 1 && joined.length <= 2300) body.g = joined;

    const tok = await ensureAuth();

  // ---------- 입력 ----------
  // 터치 존: 오른쪽 절반 = 상승(UP) · 왼쪽 위 = 가속 · 왼쪽 아래 = 감속

  // 플레이 중 입력을 가져가도 되는 건 화면 구석 컨트롤뿐이다. 그 밖의 모든 요소는

  let lastT = 0;
  // 달리는 동안에는 언어 선택·전체화면·음소거가 클릭을 삼켜 '안 눌리는 구역'이 됐다.

  let chromeOff = false;

  function update(dt) {

    if (mult >= 10 && particles.length < 90 && Math.random() < 0.35) {
      const a = Math.random() * Math.PI * 2;
      particles.push({ x: px - 8, y: player.y, vx: -spd * 0.3 + Math.cos(a) * 40, vy: Math.sin(a) * 40,
        life: 0.4 + Math.random() * 0.4, color: `hsl(${(elapsed * 300 + Math.random() * 80) % 360},100%,65%)` });
    }

    if (invulnT > 0) { invulnT -= dt; player.y = Math.max(20, Math.min(H - 20, player.y)); }

    // MAX 보유 시간이 끝나면 체인이 말하는 배율로 돌아온다
    if (maxHoldT > 0) {

    if (!reviveUsed) ghostSample();     // 부활한 런은 코스 정렬이 깨지므로 기록하지 않는다
    for (const g of gates) {

        for (const gp2 of g.gaps) {

          if (player.y > c - half + 10 && player.y < c + half - 10) { inGap = { gp: gp2, c, half }; break; }
        }
        if (!inGap) {

          if (maxShield(10)) {
            let best = g.gaps[0], bd = Infinity;
            for (const gp2 of g.gaps) { const d = Math.abs((gp2.cy + dy) - player.y); if (d < bd) { bd = d; best = gp2; } }
            player.y = best.cy + dy; player.vy = 0;
          } else return die();
        } else if (inGap.gp.laser && laserOn(inGap.gp.laser)) {
          const [la, lb] = laserSeg(inGap.gp, inGap.c, inGap.half);
          if (player.y > la && player.y < lb) {

          popup(px + 24, player.y - 46, label + ' +' + gain, '#ff2df7');
        } else {
          // 밋밋하게 지나가면 체인이 깎인다 — ×10을 유지하려면 계속 붙어서 달려야 한다
          if (chain > 0 && mult > 1) popup(px + 24, player.y - 46, 'CHAIN −', '#8f9ac4');
          chain = Math.max(0, chain - CHAIN_PENALTY);
          popup(px + 24, player.y - 26, '+' + gain, g.color);
        }
        const nm = syncMult();
        if (nm !== mult) {
          const up = nm > mult;
          mult = nm;
          popup(px, player.y - 86, mult >= 10 ? '★ MAX POWER!' : '×' + mult, mult >= 10 ? '#ff2df7' : (up ? '#ffe14d' : '#8f9ac4'));
          if (up) { multSfx(); if (mult >= 10) burst(px, player.y, '#ff2df7', 24); }
        }
        if (g.finish) onFinish();
        else if (g.idx % 10 === 0 && g.idx < CUR.len) {
          popup(W * 0.5, H * 0.3, '🚩 ' + g.idx + ' / ' + CUR.len, '#ffe14d');
          multSfx();
        }
        passSfx();
        burst(px, player.y, g.color, 14);
        updateHud();
      }
    }
    while (gates.length && gates[0].x < -60) gates.shift();
    while (gates.length < 6) pushNextGate();

    // 별 수집
    for (const c of coins) {
      c.x -= spd * dt;
      if (!c.taken && Math.hypot(c.x - px, c.y - player.y) < 28) {
        c.taken = true;
        const gain = SC_STAR * mult;
        score += gain;
        popup(c.x, c.y - 22, '★ +' + gain, '#ffe14d');
        chain++;                              // 별도 체인을 이어준다
        const nm = syncMult();
        if (nm !== mult) {
          mult = nm;
          popup(c.x, c.y - 52, mult >= 10 ? '★ MAX POWER!' : '×' + mult, mult >= 10 ? '#ff2df7' : '#ffe14d');
          if (mult >= 10) burst(c.x, c.y, '#ff2df7', 24);
        }
        coinSfx();
        burst(c.x, c.y, '#ffe14d', 12);
        updateHud();
      }
    }
    while (coins.length && coins[0].x < -40) coins.shift();

    // 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    // 점수 팝업
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 65 * dt; p.x -= speed * speedF * dt * 0.25; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
    if (shakeT > 0) shakeT -= dt;
  }

  // 피니시 라인 통과 — 여기서 공식 기록이 확정되고, 이후는 오버드라이브 보너스 구간
  function onFinish() {
    finished = true;
    clearTime = elapsed;
    const timeBonus = Math.max(0, Math.round((coursePar * 1.25 - clearTime) * 45));
    const fin = 1000 + timeBonus;
    score += fin;
    officialScore = score;
    popup(W * 0.5, H * 0.28, '🏁 COURSE CLEAR  +' + fin, '#ffe14d');
    if (timeBonus > 0) popup(W * 0.5, H * 0.38, '⏱ ' + clearTime.toFixed(1) + 's  +' + timeBonus, '#39ff88');
    burst(player.x, player.y, '#ffe14d', 40);
    burst(player.x, player.y, '#00f0ff', 26);
    shakeT = 0.3;
    multSfx();
    try { if (window.CrazyGames) CrazyGames.SDK.game.happytime(); } catch (_) {}
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, color });
    }
  }

  function die() {
    state = 'over';
    dieSfx();
    shakeT = 0.35;
    burst(player.x, player.y, '#ff2d55', 40);
    document.getElementById('score-live').textContent = '';
    document.getElementById('mult-badge').textContent = '';
    document.getElementById('gate-badge').textContent = '';
    // 무료 이어하기 1회 (3게이트 이상 진행 시)
    if (!reviveUsed && gatesPassed >= 3) {
      setTimeout(showRevive, 450);
      return;
    }
    finishOver();
  }

  function showRevive() {
    const rs = document.getElementById('revive-screen');
    rs.classList.remove('hidden');
    let n = 3;
    document.getElementById('revive-count').textContent = n;
    reviveTimer = setInterval(() => {
      n--;
      if (n <= 0) {
        clearInterval(reviveTimer);
        rs.classList.add('hidden');
        finishOver();
      } else {
        document.getElementById('revive-count').textContent = n;
      }
    }, 1000);
  }

  function doRevive() {
    clearInterval(reviveTimer);
    document.getElementById('revive-screen').classList.add('hidden');
    reviveUsed = true;
    // 코스가 고정이므로 죽은 지점의 게이트를 그대로 다시 깔아준다
    gates = []; coins = []; popups = [];
    player.y = H / 2; player.vy = 0;
    player.trail = [];
    gateSeq = gatesPassed;
    for (let i = 0; i < 6; i++) pushNextGate();
    const lead = 280;                      // 숨 돌릴 거리
    for (const g of gates) g.x += lead;
    for (const c of coins) c.x += lead;
    ghostFrozen = true; ghostFreezeScore = score;   // 여기까지가 코스와 정렬된 궤적
    chain = 0; mult = 1; maxHoldT = 0;     // 부활하면 체인은 끊긴다
    holding = false; holdMin = 0; keyThrottle = 0; mouseBrake = false; touchBrake = false; touchBoost = false;
    energy = 100;
    invulnT = 0;
    state = 'play';
    updateHud();
  }

  // 최근 14일 메달 달력 — 돌아올 이유를 눈에 보이게 남긴다
  // 오늘의 세 코스를 한 줄씩. 잠긴 런은 눌리지 않고, 다음에 달릴 런만 분홍 테두리.
  function renderRuns() {
    const box = document.getElementById('run-list');
    if (!box || !courses.length) return;
    const nxt = nextRun(), done = allCleared();
    box.innerHTML = '';
    for (let i = 0; i < RUN_N; i++) {
      const open = runUnlocked(i);
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'run-row' + (open ? '' : ' locked') + (runClear[i] ? ' done' : '')
                      + (open && !done && i === nxt ? ' next' : '');
      const med = medalOfRun(i);
      const rn = document.createElement('span'); rn.className = 'rn'; rn.textContent = 'RUN ' + (i + 1);
      const rl = document.createElement('span'); rl.className = 'rl';
      rl.textContent = open ? T('runTag' + (i + 1)) : T('lockedRow').replace('{n}', i);
      const rm = document.createElement('span'); rm.className = 'rm';
      rm.textContent = open ? (MEDAL_ICON[med] || (runClear[i] ? '✓' : '')) : '🔒';
      const rs = document.createElement('span'); rs.className = 'rs';
      rs.textContent = runBest[i] ? runBest[i].toLocaleString() : '—';
      row.appendChild(rn); row.appendChild(rl); row.appendChild(rm); row.appendChild(rs);
      if (open) {
        row.addEventListener('click', ev => { ev.stopPropagation(); startGame(i); });
        row.addEventListener('pointerdown', ev => ev.stopPropagation());
      }
      box.appendChild(row);
    }
    const tot = dailyTotal(), dm = medalOfDay();
    const dt = document.getElementById('day-total');
    // 비교 대상은 이론상 만점이 아니라 '오늘 세계 1위' — 닿을 수 있는 숫자여야 다시 달린다
    dt.textContent = T('dayTotal') + ' ' + tot.toLocaleString() + (dm ? '  ' + MEDAL_ICON[dm] : '');
    const tl = document.getElementById('day-top');
    if (tl) {
      if (worldTop > 0) {
        tl.textContent = T('dayTopLine').replace('{s}', worldTop.toLocaleString())
          + (worldTopName ? '  ·  ' + String(worldTopName).slice(0, 12) : '');
        tl.classList.toggle('lead', tot > 0 && tot >= worldTop);
      } else {
        tl.textContent = worldTopLoaded ? T('dayTopNone') : '';
        tl.classList.remove('lead');
      }
    }
    const bs = document.getElementById('btn-start');
    bs.textContent = done ? T('startImprove') : T('startRun').replace('{n}', nxt + 1);
  }

  function renderCalendar() {
    const cal = document.getElementById('cal');
    if (!cal) return;
    const days = loadDays();
    cal.innerHTML = '';
    for (let i = 13; i >= 0; i--) {
      const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
      const rec = days[d];
      const el = document.createElement('div');
      el.className = 'd' + (rec && rec.m ? ' m' + rec.m : '') + (d === dateStr ? ' today' : '');
      el.title = rec ? d + ' · ' + rec.s : d;
      el.textContent = rec && rec.m ? MEDAL_ICON[rec.m] : '';
      cal.appendChild(el);
    }
  }

  // 게임오버 화면의 문구 — 언어를 바꿔도 다시 그릴 수 있게 분리
  function renderOverTexts() {
    if (!lastRun) return;
    const r = lastRun;
    document.getElementById('final-score').textContent = r.official;
    document.getElementById('best-over').textContent = `${T('best')}: ${r.best}`;
    document.getElementById('over-label').textContent = r.finished
      ? T('cleared').replace('{n}', r.run + 1) : 'RUN ' + (r.run + 1) + '  ' + T('over');
    document.getElementById('reached-line').textContent = r.finished
      ? T('clearTime').replace('{t}', r.clearTime.toFixed(1))
      : T('reachedOf').replace('{n}', r.gatesPassed).replace('{m}', r.len || CUR.len);
    const ml = document.getElementById('medal-line');
    if (r.medal > 0) {
      ml.classList.remove('hidden');
      ml.textContent = T('medalLine').replace('{icon}', MEDAL_ICON[r.medal]).replace('{name}', T('m' + r.medal));
    } else if (r.finished && r.nextCut) {
      ml.classList.remove('hidden');
      ml.textContent = T('nextMedal').replace('{n}', r.nextCut.need).replace('{name}', T('m' + r.nextCut.lvl));
    } else {
      ml.classList.add('hidden');
      ml.textContent = '';
    }
    const ol = document.getElementById('overdrive-line');
    ol.classList.toggle('hidden', !r.overdrive);
    ol.textContent = r.overdrive ? T('overdriveLine').replace('{n}', r.overdrive) : '';
    // 순위에 올라가는 건 세 런의 합이므로 그 값을 분명히 보여준다
    document.getElementById('rank-line').textContent =
      (r.dayDone ? T('dayDoneMsg') + '  ' : (r.justUnlocked ? T('unlockedMsg').replace('{n}', r.run + 2) + '  ' : ''))
      + T('dayTotalLine').replace('{s}', (r.total || 0).toLocaleString());
    document.getElementById('btn-retry').textContent = T('retryRun').replace('{n}', r.run + 1);
    document.getElementById('btn-runs').textContent = T('backToRuns');
    document.getElementById('new-best').textContent = T('newBest');
  }

  function finishOver() {
    // 리더보드에 올라가는 값은 피니시 라인에서 확정된 공식 점수.
    // 오버드라이브(완주 후 보너스 구간) 점수는 순위에 섞이지 않는다.
    const official = finished ? officialScore : score;
    const overdrive = finished ? score - officialScore : 0;
    const medal = medalOf(official, finished);
    let nextCut = null;
    for (let i = 0; i < MEDAL_CUT.length; i++) {
      const need = Math.ceil(courseMax * MEDAL_CUT[i]) - official;
      if (need > 0) { nextCut = { lvl: i + 1, need }; break; }
    }
    const prevBest = runBest[runIdx];
    const isNewBest = official > prevBest && official > 0;
    const hadCleared = runClear[runIdx];
    const hadAll = allCleared();
    if (isNewBest) runBest[runIdx] = official;
    if (finished) runClear[runIdx] = true;
    saveRuns();
    const best = runBest[runIdx];
    // 다음 런이 방금 열렸는지 / 오늘 세 런을 방금 다 끝냈는지
    const justUnlocked = finished && !hadCleared && runIdx + 1 < RUN_N;
    const dayDone = finished && !hadAll && allCleared();
    // 순위에 올라가는 값은 세 런 최고점의 합 — 어느 런을 개선해도 단조 증가한다
    submitScore = dailyTotal();
    if (gatesPassed > bestG) {
      bestG = gatesPassed;
      localStorage.setItem(BESTG_KEY, bestG);
    }
    if (submitScore > 0) saveDay({ s: submitScore, m: medalOfDay(), g: gatesPassed, r: runBest.slice(), t: finished ? +clearTime.toFixed(1) : 0 });
    // 내 베스트 고스트. 부활을 쓴 런은 '부활 직전까지'만 코스와 정렬되므로
    // 그 지점의 점수로 베스트를 가리고 잘린 궤적을 저장한다. 예전처럼 부활한 런을
    // 통째로 버리면, 거의 항상 부활을 쓰게 되는 RUN 2·3에는 고스트가 영영 안 생긴다.
    const gScore = reviveUsed ? ghostFreezeScore : official;
    if (ghostRec.length > 8 && gScore > 0) {
      const gsKey = ghostScoreKey(runIdx);
      if (gScore > +(localStorage.getItem(gsKey) || 0)) {
        ghostMine = Uint8Array.from(ghostRec);
        try {
          localStorage.setItem(ghostKey(runIdx), ghostEncode(ghostRec));
          localStorage.setItem(gsKey, gScore);
        } catch (_) {}
      }
    }
    lastRun = { best, gatesPassed, isNewBest, official, overdrive, medal, nextCut, finished, clearTime,
                run: runIdx, len: CUR.len, justUnlocked, dayDone, total: submitScore };
    renderOverTexts();
    document.getElementById('new-best').classList.toggle('hidden', !isNewBest);
    document.getElementById('rank-hint').textContent = '';
    renderCalendar();
    renderRuns();
    const csEl = document.getElementById('streak');
    const cs = clearStreak();
    if (cs > 0) csEl.textContent = T('clearStreak').replace('{n}', cs);
    try { if (isNewBest && window.CrazyGames) CrazyGames.SDK.game.happytime(); } catch (_) {}
    try { if (window.CrazyGames) CrazyGames.SDK.game.gameplayStop(); } catch (_) {}
    resetSubmitUI();
    lbDate = dateStr;    // 게임오버 시엔 항상 오늘 보드부터
    setTimeout(() => {
      document.getElementById('over-screen').classList.remove('hidden');
      refreshLb().then(autoSubmit);   // 리더보드 표시 후 자동 등록 → 내 기록 강조
    }, 450);
  }

  // ---------- 렌더 ----------
  function draw(t) {
    // 1) 디바이스 전체를 그라데이션 + 앰비언트 별로 채워 레터박스(검은 여백)를 자연스럽게
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = bgGradDev;
    ctx.fillRect(0, 0, cssW, cssH);
    const scroll0 = state === 'play' ? dist : t * 40;
    ctx.fillStyle = '#cfeaff';
    ctx.globalAlpha = 0.4 + 0.12 * Math.sin(t * 1.5);   // 전체 은은한 반짝임 (한 번의 배칭 fill)
    ctx.beginPath();
    for (const s of stars) {
      const x = ((s.x * cssW - scroll0 * s.depth * 0.5) % (cssW * 1.2) + cssW * 1.2) % (cssW * 1.2) - cssW * 0.1;
      ctx.moveTo(x + s.r, s.y * cssH);
      ctx.arc(x, s.y * cssH, s.r * 0.8, 0, 7);
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    // 2) 가상 해상도 변환 적용 (플레이 필드를 화면 중앙에 스케일)
    ctx.setTransform(DPR * vscale, 0, 0, DPR * vscale, DPR * voffX, DPR * voffY);
    ctx.save();
    if (shakeT > 0) ctx.translate((Math.random() - .5) * shakeT * 30, (Math.random() - .5) * shakeT * 30);

    // 배경 (플레이 필드)
    ctx.fillStyle = bgGradField;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 별 (패럴랙스) — 한 번의 배칭 fill로 효율화
    const scroll = state === 'play' ? dist : t * 40;
    ctx.fillStyle = '#cfeaff';
    ctx.globalAlpha = 0.55 + 0.15 * Math.sin(t * 1.5);
    ctx.beginPath();
    for (const s of stars) {
      const x = ((s.x * W - scroll * s.depth) % (W * 1.2) + W * 1.2) % (W * 1.2) - W * 0.1;
      ctx.moveTo(x + s.r, s.y * H);
      ctx.arc(x, s.y * H, s.r, 0, 7);
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    // 그리드 바닥 (신스웨이브 느낌) — 한 번의 stroke로 배칭
    ctx.strokeStyle = 'rgba(106, 91, 255, 0.22)';
    ctx.lineWidth = 1;
    const gridOff = (scroll * 0.6) % 70;
    ctx.beginPath();
    for (let x = -gridOff; x < W; x += 70) { ctx.moveTo(x, H * 0.82); ctx.lineTo(x - 90, H); }
    for (let i = 0; i < 5; i++) {
      const y = H * 0.82 + (H * 0.18) * (i / 4) ** 1.6;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();

    // 게이트 (글로우는 shadowBlur 대신 저비용 반투명 레이어)
    if (state !== 'idle') {
      const capPts = [];      // 모든 게이트의 통로 끝 캡을 모아 한 번에 그리기 위함
      for (const g of gates) {
        if (g.x < -40 || g.x > W + 40) continue;
        const dy = gateDY(g);
        const pulse = 0.75 + 0.25 * Math.sin(t * 5 + g.pulse);
        // 통로들을 위에서 아래로 정렬해 기둥 구간 계산
        const sorted = g.gaps.map(gp2 => {
          const half = gapHalf(g, gp2);
          return { top: gp2.cy + dy - half, bot: gp2.cy + dy + half, gp: gp2, half };
        }).sort((a, b) => a.top - b.top);
        const segs = [];   // 기둥(막힌) 구간들
        let cur = -10;
        for (const s of sorted) { segs.push([cur, s.top]); cur = s.bot; }
        segs.push([cur, H + 10]);
        ctx.fillStyle = g.color;
        // 글로우 레이어 1회 + 코어 1회 = 게이트당 fill 2회로 배칭
        ctx.globalAlpha = 0.28 * pulse;
        ctx.beginPath();
        for (const [y0, y1] of segs) { if (y1 - y0 > 0) ctx.roundRect(g.x - 13, y0, 26, y1 - y0, 10); }
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath();
        for (const [y0, y1] of segs) { if (y1 - y0 > 0) ctx.roundRect(g.x - 8, y0, 16, y1 - y0, 8); }
        ctx.fill();
        // 통로 끝 캡은 전 게이트를 모아 마지막에 한 번에 그림
        for (const s of sorted) capPts.push(g.x, s.top, s.bot, 5 * pulse + 2);
        // 게이트 번호 (크고 잘 보이게) + BEST 깃발
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // 번호 배경 알약
        ctx.fillStyle = 'rgba(5,1,15,0.55)';
        const numStr = '' + g.idx, numW = 20 + numStr.length * 15;
        roundRect(g.x - numW / 2, 8, numW, 34, 10);
        ctx.fillStyle = g.color;
        ctx.font = '800 26px "Segoe UI", sans-serif';
        ctx.fillText(numStr, g.x, 26);
        if (bestG > 0 && g.idx === bestG + 1 && !g.finish) {
          ctx.fillStyle = '#ffe14d';
          ctx.font = '800 16px "Segoe UI", sans-serif';
          ctx.fillText('★ BEST', g.x, 56);
        }
        if (g.finish) {
          // 피니시 라인 — 체커 기둥 + 금색 표지 (shadowBlur 없이)
          ctx.globalAlpha = 0.5;
          for (let yy = 0; yy < H; yy += 24) {
            ctx.fillStyle = ((yy / 24) | 0) % 2 ? '#ffffff' : '#1a1030';
            ctx.fillRect(g.x - 20, yy, 7, 24);
            ctx.fillRect(g.x + 13, yy, 7, 24);
          }
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#ffe14d';
          ctx.font = '800 20px "Segoe UI", sans-serif';
          ctx.fillText('🏁 FINISH', g.x, 58);
        }
        ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
        // 레이저: 켜지면 붉게, 켜지기 직전엔 흐릿한 예고
        for (const s of sorted) {
          if (!s.gp.laser) continue;
          const on = laserOn(s.gp.laser), warn = laserWarn(s.gp.laser);
          if (!on && !warn) continue;
          const c2 = s.gp.cy + dy;
          const [a, b] = laserSeg(s.gp, c2, s.half);
          ctx.strokeStyle = '#ff2d55';
          if (on) {
            const flick = 0.75 + 0.25 * Math.sin(t * 40);
            ctx.globalAlpha = 0.25 * flick;
            ctx.lineWidth = 11;
            ctx.beginPath(); ctx.moveTo(g.x, a + 2); ctx.lineTo(g.x, b - 2); ctx.stroke();
            ctx.globalAlpha = flick;
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(g.x, a + 2); ctx.lineTo(g.x, b - 2); ctx.stroke();
            ctx.strokeStyle = '#ffd7de';
            ctx.globalAlpha = 0.9;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(g.x, a + 2); ctx.lineTo(g.x, b - 2); ctx.stroke();
            ctx.fillStyle = '#ff2d55';
            ctx.beginPath(); ctx.arc(g.x, s.gp.laser.full ? a : (s.gp.segTop ? a : b), 6, 0, 7); ctx.fill();
            ctx.fillStyle = '#fff';
          } else {
            ctx.globalAlpha = 0.22;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(g.x, a + 2); ctx.lineTo(g.x, b - 2); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }

      // 모든 게이트의 통로 끝 캡을 한 번의 fill로
      if (capPts.length) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        for (let i = 0; i < capPts.length; i += 4) {
          const x = capPts[i], tp = capPts[i + 1], bt = capPts[i + 2], r = capPts[i + 3];
          ctx.moveTo(x + r, tp); ctx.arc(x, tp, r, 0, 7);
          ctx.moveTo(x + r, bt); ctx.arc(x, bt, r, 0, 7);
        }
        ctx.fill();
      }

      // 별
      for (const c of coins) {
        if (c.taken || c.x < -30 || c.x > W + 30) continue;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.fillStyle = '#ffe14d';
        ctx.globalAlpha = 0.2;
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.rotate(t * 2 + c.spin);
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? 4.5 : 10, a = i * Math.PI / 5 - Math.PI / 2;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // 파티클
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 점수 팝업
    if (popups.length) {
      ctx.font = '800 19px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life * 1.8);
        ctx.fillStyle = p.color;
        ctx.fillText(p.txt, p.x, p.y);
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'start';
    }

    // 고스트 (내 베스트 · 월드 1위) — 코스가 거리 기준으로 고정이라 정확히 겹쳐 달린다
    if (state === 'play' || state === 'paused') {
      drawGhost(ghostWorld, '#ffd700', 0.30);
      drawGhost(ghostMine, '#7ff5ff', 0.36);
    }

    // 플레이어 + 트레일
    if (state === 'play' || state === 'paused' || (state === 'over' && shakeT > 0)) {
      const fever = mult >= 5, maxMode = mult >= 10;
      const tlen = player.trail.length;
      for (let i = tlen - 1; i > 0; i--) {
        const p = player.trail[i];
        const f = 1 - i / tlen;
        ctx.globalAlpha = f * (maxMode ? 0.8 : 0.5);
        // 꼬리 색이 곧 '방패가 있나'를 말해야 한다. 예전엔 ×5부터 이미 무지개라
        // 방패 없는 ×5~×9와 방패 있는 ×10이 똑같아 보였고, 무지개를 달고도 한 방에 죽었다.
        // 이제 ×5~×9는 금색 한 가지, 무지개는 ×10에서만 돈다.
        ctx.fillStyle = maxMode ? `hsl(${(t * 400 + i * 26) % 360}, 100%, 66%)`
          : (fever ? `hsl(${44 + Math.sin(t * 3 + i * 0.25) * 12}, 100%, 62%)` : '#00f0ff');
        ctx.beginPath(); ctx.arc(p.x, p.y, (maxMode ? 12 : 8) * f + 1, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      // 방패 발동 직후: 금색 보호막 링 점멸
      if (invulnT > 0 && state === 'play') {
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 25);
        ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, 30, 0, 7); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      // MAX 모드: 기체 주변 무지개 오라
      if (maxMode && (state === 'play' || state === 'paused')) {
        for (let k = 0; k < 3; k++) {
          ctx.globalAlpha = 0.18;
          ctx.fillStyle = `hsl(${(t * 400 + k * 120) % 360},100%,65%)`;
          ctx.beginPath(); ctx.arc(player.x, player.y, 26 + k * 8 + Math.sin(t * 8 + k) * 4, 0, 7); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (state === 'play' || state === 'paused') {
        const tilt = Math.max(-0.5, Math.min(0.5, player.vy / 700));
        // 에너지 부족 시 기체가 빨갛게 점멸 (25% 이하)
        const lowE = state === 'play' && energy < 25;
        const flash = lowE ? (0.5 + 0.5 * Math.sin(t * 18)) : 0;
        const haloColor = lowE ? '#ff2d55' : '#00f0ff';
        const bodyColor = lowE ? `rgb(255,${Math.round(215 - 120 * flash)},${Math.round(220 - 150 * flash)})` : '#eafcff';
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(tilt);
        ctx.fillStyle = haloColor;
        ctx.globalAlpha = 0.2 + 0.25 * flash;
        ctx.beginPath(); ctx.arc(0, 0, 22 + 6 * flash, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(2, 0, 13, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(-12, -9); ctx.lineTo(-6, 0); ctx.lineTo(-12, 9);
        ctx.closePath(); ctx.fill();
        // 부스트 화염
        if (speedF > 1.15) {
          const fl = 16 + Math.random() * 12;
          ctx.fillStyle = '#39ff88';
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.moveTo(-11, -5); ctx.lineTo(-11 - fl, 0); ctx.lineTo(-11, 5);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }
    }
    ctx.restore();

    // 에너지 바 + 비행거리 (우주 스케일)
    if (state === 'play' || state === 'paused') {
      const bw = 200, bx = (W - bw) / 2, by = H - 30;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx, by, bw, 8);
      ctx.fillStyle = energy < 25 ? '#ff2d55' : (speedF > 1.15 ? '#39ff88' : '#00f0ff');
      ctx.fillRect(bx, by, bw * (energy / 100), 8);
      ctx.textAlign = 'center';
      ctx.font = '700 13px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('⚡', bx - 14, by + 8);
      ctx.font = '700 15px "Segoe UI", sans-serif';
      ctx.fillStyle = '#9fd8ff';
      ctx.fillText('🛸 ' + Math.floor(dist / 10).toLocaleString() + ' km', W / 2, 66);
      ctx.textAlign = 'start';
    }
    // 일시정지 오버레이
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(5,1,15,0.55)';
      ctx.fillRect(-4000, -4000, W + 8000, H + 8000);
      ctx.textAlign = 'center';
      ctx.font = '800 42px "Segoe UI", sans-serif';
      ctx.fillStyle = '#bffaff';
      ctx.fillText('⏸ PAUSED', W / 2, H / 2);
      ctx.font = '600 18px "Segoe UI", sans-serif';
      ctx.fillStyle = '#7ff5ff';
      ctx.fillText('▶ tap to resume', W / 2, H / 2 + 38);
      ctx.textAlign = 'start';
    }

    // 속도감 스피드라인 (전체 화면, 디바이스 좌표) — 한 번의 stroke로 배칭해 효율화
    if (state === 'play') {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const boost = speedF > 1.12, brake = speedF < 0.9;
      const nLines = boost ? 16 : (brake ? 3 : 7);
      ctx.strokeStyle = boost ? '#5bff9d' : (brake ? '#6f9dff' : '#cfe8ff');
      ctx.globalAlpha = boost ? 0.4 : (brake ? 0.28 : 0.2);
      ctx.lineWidth = boost ? 3 : 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < nLines; i++) {
        const y = Math.random() * cssH;
        const x0 = Math.random() * cssW;
        const len = boost ? (150 + Math.random() * 200) : (brake ? (14 + Math.random() * 24) : (70 + Math.random() * 100));
        ctx.moveTo(x0, y); ctx.lineTo(x0 - len, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineCap = 'butt';
    }

    // 터치 존 안내 (터치 기기, 게임 초반 몇 초간 크게 표시 후 페이드) — 디바이스 좌표
    if (state === 'play' && isTouch && elapsed < 6.5) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const fade = elapsed > 4.5 ? Math.max(0, (6.5 - elapsed) / 2) : 1;
      const R = Math.min(cssW, cssH) * 0.13;             // 버튼 크기
      const zones = [
        [cssW * 0.25, cssH * 0.27, '⏩', 'BOOST', '#39ff88'],   // 왼쪽 위 = 가속
        [cssW * 0.25, cssH * 0.73, '⏪', 'BRAKE', '#00f0ff'],   // 왼쪽 아래 = 감속
        [cssW * 0.75, cssH * 0.5,  '☝', 'UP',    '#ffe14d'],   // 오른쪽 = 상승
      ];
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const [x, y, icon, label, c] of zones) {
        ctx.globalAlpha = 0.16 * fade; ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.7 * fade; ctx.strokeStyle = c; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
        ctx.globalAlpha = 0.95 * fade; ctx.fillStyle = '#fff';
        ctx.font = `${Math.round(R * 0.9)}px "Segoe UI", sans-serif`;
        ctx.fillText(icon, x, y - R * 0.12);
        ctx.fillStyle = c; ctx.font = `700 ${Math.round(R * 0.32)}px "Segoe UI", sans-serif`;
        ctx.fillText(label, x, y + R * 0.62);
      }
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
    }
  }

  function drawGhost(g, color, alpha) {
    const y = ghostY(g, dist);
    if (y == null) return;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(player.x, y, 11, 0, 7); ctx.fill();
    ctx.globalAlpha = alpha * 0.55;
    ctx.beginPath();
    const y2 = ghostY(g, dist - 70), y3 = ghostY(g, dist - 140);
    if (y2 != null) { ctx.moveTo(player.x - 20, y2); ctx.arc(player.x - 28, y2, 7, 0, 7); }
    if (y3 != null) { ctx.moveTo(player.x - 46, y3); ctx.arc(player.x - 52, y3, 4.5, 0, 7); }
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, Math.max(h, 0), r);
    ctx.fill();
  }

  // ---------- UI ----------
  const startScreen = document.getElementById('start-screen');
  const overScreen = document.getElementById('over-screen');
  applyLang();
  renderRuns();

  // 다음 코스 카운트다운 (UTC 자정에 코스 교체)
  function updateCourseTimer() {
    const now = new Date();
    const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
    let s = Math.max(0, ((next - now.getTime()) / 1000) | 0);
    const t = `${String((s / 3600) | 0).padStart(2, '0')}:${String(((s % 3600) / 60) | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    document.getElementById('next-course').textContent = T('nextCourse').replace('{t}', t);
  }
  setInterval(updateCourseTimer, 1000);
  updateCourseTimer();

  // PWA 설치 버튼: 브라우저가 설치 가능하다고 알려줄 때만 노출
  let installPrompt = null;
  const installBtn = document.getElementById('btn-install');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installPrompt = e;
    installBtn.textContent = T('install');
    installBtn.classList.remove('hidden');
  });
  installBtn.addEventListener('pointerdown', e => e.stopPropagation());
  installBtn.addEventListener('click', async e => {
    e.stopPropagation();
    if (!installPrompt) return;
    installBtn.classList.add('hidden');
    try { installPrompt.prompt(); await installPrompt.userChoice; } catch (_) {}
    installPrompt = null;
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; installBtn.classList.add('hidden'); });

  // 개인정보 안내 토글 — 시작 화면은 아무 데나 눌러도 게임이 시작되므로 전파를 막는다
  const privacyBtn = document.getElementById('btn-privacy');
  const privacyBox = document.getElementById('privacy-box');
  privacyBtn.addEventListener('pointerdown', e => e.stopPropagation());
  privacyBtn.addEventListener('click', e => {
    e.stopPropagation();
    privacyBox.classList.toggle('hidden');
    privacyBtn.textContent = privacyBox.classList.contains('hidden') ? T('privacy') : T('privacyClose');
  });
  privacyBox.addEventListener('pointerdown', e => e.stopPropagation());
  privacyBox.addEventListener('click', e => e.stopPropagation());

  // 전체화면 버튼: 탭하면 가로 전체화면 잠금 시도 (미지원 시 회전 표시로 대체됨)
  document.getElementById('fs-btn').addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('fs-btn').addEventListener('click', e => {
    e.stopPropagation();
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        Promise.resolve(req.call(el)).then(() => {
          try { if (screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape'); } catch (_) {}
        }).catch(() => {}).finally(() => setTimeout(resize, 200));
      }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { try { exit.call(document); } catch (_) {} }
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (_) {}
      setTimeout(resize, 200);
    }
  });
  document.addEventListener('fullscreenchange', () => setTimeout(resize, 150));

  // 어제 세계 랭킹 배지 (락인 인센티브)
  (async () => {
    try {
      const myName = localStorage.getItem('ng-name');
      if (!myName || !LB_URL) return;
      const yd = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const rows = await lbAll(yd);
      const idx = rows.findIndex(e => e.n === myName);
      if (idx >= 0) { yRankIdx = idx; document.getElementById('ybadge').textContent = T('yRank').replace('{n}', idx + 1); }
    } catch (_) {}
  })();

  // 오늘 1위의 궤적을 받아둔다 (없으면 조용히 넘어감)
  async function loadWorldGhost() {
    if (!LB_URL) return;
    try {
      const rows = await lbAll(dateStr);
      worldTopLoaded = true;
      if (rows.length) { worldTop = rows[0].s || 0; worldTopName = rows[0].n || ''; }
      renderRuns();
      const top = rows.find(e => e && e.g);
      if (!top) return;
      ghostWorldName = top.n;
      // 세 런의 궤적이 '|'로 이어져 있다 (빈 칸은 그 런 기록이 없다는 뜻)
      const parts = String(top.g).split('|');
      worldGhosts = [];
      for (let i = 0; i < RUN_N; i++) worldGhosts.push(parts[i] ? ghostDecode(parts[i]) : null);
      ghostWorld = worldGhosts[runIdx] || null;
    } catch (_) {}
  }
  loadWorldGhost();

  function startGame(ri) {
    if (typeof ri !== 'number') ri = nextRun();
    if (!runUnlocked(ri)) return;
    ensureAudio();
    reset(ri);
    submitScore = 0;
    ghostMine = ghostDecode(localStorage.getItem(ghostKey(ri)) || '');
    ghostWorld = worldGhosts[ri] || null;
    state = 'play';
    // 직전에 누른 버튼이나 언어 셀렉트에 포커스가 남아 있으면 Space·방향키를 그쪽이 먹는다
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (_) {}
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    updateHud();
    try { if (window.CrazyGames) CrazyGames.SDK.game.gameplayStart(); } catch (_) {}
  }
  document.getElementById('btn-start').addEventListener('click', e => { e.stopPropagation(); startGame(); });
  // 다시 도전은 같은 런을, '오늘의 코스'는 선택 화면으로
  document.getElementById('btn-retry').addEventListener('click', e => { e.stopPropagation(); startGame(runIdx); });
  document.getElementById('btn-runs').addEventListener('click', e => {
    e.stopPropagation();
    overScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
    state = 'idle';
    renderRuns();
  });
  document.getElementById('btn-runs').addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('btn-revive').addEventListener('click', e => { e.stopPropagation(); doRevive(); });
  document.getElementById('btn-revive').addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('btn-skip-revive').addEventListener('click', e => {
    e.stopPropagation();
    clearInterval(reviveTimer);
    document.getElementById('revive-screen').classList.add('hidden');
    finishOver();
  });
  document.getElementById('btn-skip-revive').addEventListener('pointerdown', e => e.stopPropagation());

  // ---------- 점수 공유 ----------
  document.getElementById('btn-share').addEventListener('click', async e => {
    e.stopPropagation();
    // 어디서 플레이하든(포털 임베드 포함) 공유는 항상 대표 주소로 보낸다.
    // 실행 주소를 쓰면 포털 도메인이나 옛 주소가 퍼진다.
    const text = T('shareText').replace('{date}', dateStr).replace('{score}', submitScore).replace('{url}', 'https://neon.habitschool.kr/');
    try {
      if (navigator.share) {
        await navigator.share({ text });
      } else {
        await navigator.clipboard.writeText(text);
        toast(T('copied'));
      }
    } catch (_) { /* 사용자가 공유 취소 */ }
  });

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
